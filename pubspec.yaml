name: watchers
description: A Movies and TV Shows tracking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Networking
  dio: ^5.4.0
  http: ^1.2.0

  # Local storage
  shared_preferences: ^2.2.2

  # URL launching (for opening trailers)
  url_launcher: ^6.2.4

  # Image caching & network images
  cached_network_image: ^3.3.1

  # Routing
  go_router: ^13.2.0

  # Optional utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Add your assets if you have any, for example:
  # assets:
  #   - assets/images/
  #   - assets/icons/